<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ghost Radio — Lattice Murmur</title>
  <meta
    name="description"
    content="A haunted lattice of drifting resonators and pointer-inked murmurs."
  />
  <meta name="theme-color" content="#070a13" />
  <meta name="robots" content="index,follow" />
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <style>
    :root {
      color-scheme: dark;
      --bg: #070a13;
      --panel: rgba(12, 14, 22, 0.84);
      --line: rgba(255, 255, 255, 0.12);
      --text: #f4f7ff;
      --muted: #a8b1cc;
      --accent: #8de8ff;
      --accent2: #ff94d7;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      font: 16px/1.45 "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 15% 15%, rgba(141, 232, 255, 0.16), transparent 30%),
        radial-gradient(circle at 85% 14%, rgba(255, 148, 215, 0.15), transparent 28%),
        linear-gradient(180deg, #05070d 0%, #090b12 50%, #05060a 100%);
      overflow: hidden;
      width: 100%;
      height: 100%;
    }

    .shell {
      width: min(1220px, calc(100vw - 18px));
      margin: 10px auto;
      min-height: calc(100vh - 20px);
      border: 1px solid var(--line);
      border-radius: 18px;
      background: linear-gradient(140deg, rgba(10, 13, 24, 0.85), rgba(7, 10, 17, 0.82));
      backdrop-filter: blur(10px);
      box-shadow: 0 28px 90px rgba(0, 0, 0, 0.45);
      overflow: hidden;
      display: grid;
      grid-template-rows: auto 1fr;
    }

    .toolbar {
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 10px;
      align-items: center;
      padding: 12px;
      background: rgba(12, 16, 30, 0.72);
    }

    .left {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      min-width: 0;
    }

    h1 {
      margin: 0;
      font: 700 1.2rem/1.1 "Trebuchet MS", sans-serif;
      letter-spacing: 0.02em;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .sub {
      margin: 0;
      color: var(--muted);
      font-size: 0.88rem;
    }

    .controls {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    button,
    input[type="range"],
    input[type="number"] {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: 10px;
      padding: 8px 10px;
      font: inherit;
      appearance: none;
    }

    button {
      cursor: pointer;
      transition: transform .12s ease, border-color .12s ease;
    }

    button:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--accent) 45%, white 55%);
    }

    label {
      color: #d8deef;
      font-size: 0.78rem;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 140px;
      cursor: pointer;
    }

    .back {
      margin-right: 2px;
      color: #dbe6ff;
      text-decoration: none;
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 8px 10px;
      border-radius: 10px;
      white-space: nowrap;
    }

    .canvas-wrap {
      position: relative;
      min-height: 0;
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      opacity: 0.99;
    }

    .hud {
      position: absolute;
      left: 10px;
      right: 10px;
      bottom: 10px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      gap: 8px;
      font-size: 0.76rem;
      color: #d9e2f5;
      pointer-events: none;
      text-wrap: balance;
    }

    .pill {
      padding: 6px 8px;
      border-radius: 999px;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(0, 0, 0, 0.33);
      backdrop-filter: blur(2px);
    }

    @media (max-width: 980px) {
      .toolbar {
        grid-template-columns: 1fr;
      }

      .controls {
        justify-content: flex-start;
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <section class="toolbar" aria-label="Lattice controls">
      <div class="left">
        <h1>Lattice Murmur</h1>
        <p class="sub">A haunted web of resonators drifts, snaps, and answers to cursor pressure.</p>
      </div>
      <div class="controls">
        <label>
          Density
          <input id="density" type="range" min="40" max="240" value="130" />
        </label>
        <label>
          Chaos
          <input id="chaos" type="range" min="0" max="110" value="45" />
        </label>
        <label>
          Heat
          <input id="heat" type="range" min="0" max="140" value="70" />
        </label>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="reseedBtn" type="button">Reseed</button>
        <button id="copyBtn" type="button">Copy share link</button>
        <button id="saveBtn" type="button">Save PNG</button>
        <a class="back" href="./">Back to Ghost Radio</a>
      </div>
    </section>

    <section class="canvas-wrap" aria-label="Lattice canvas">
      <canvas id="veil" aria-label="Murmuring resonance lattice"></canvas>
      <div class="hud" aria-live="polite">
        <span class="pill" id="seedLine">seed: ...</span>
        <span class="pill" id="modeLine">mode: drift</span>
        <span class="pill" id="statusLine">status: waking</span>
      </div>
    </section>
  </main>

  <script>
    const canvas = document.getElementById('veil');
    const ctx = canvas.getContext('2d');
    const density = document.getElementById('density');
    const chaos = document.getElementById('chaos');
    const heat = document.getElementById('heat');
    const pauseBtn = document.getElementById('pauseBtn');
    const reseedBtn = document.getElementById('reseedBtn');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const seedLine = document.getElementById('seedLine');
    const modeLine = document.getElementById('modeLine');
    const statusLine = document.getElementById('statusLine');

    const params = new URLSearchParams(window.location.hash.replace(/^#/, ''));

    function rngFromSeed(seed) {
      let state = (seed >>> 0) || 2463534242;
      return function next() {
        state ^= state << 13;
        state ^= state >>> 17;
        state ^= state << 5;
        return ((state >>> 0) / 4294967296);
      };
    }

    function makeSeed(raw) {
      const n = Number(raw);
      if (Number.isFinite(n)) return Math.abs(Math.floor(n)) % 2147483647;
      const now = Date.now();
      return (now * 9301 + 49297) % 2147483647;
    }

    const state = {
      seed: makeSeed(params.get('seed')),
      density: clamp(Math.round(Number(params.get('density')) || 130), 40, 240),
      chaos: clamp(Math.round(Number(params.get('chaos')) || 45), 0, 110),
      heat: clamp(Math.round(Number(params.get('heat')) || 70), 0, 140),
      pointer: { x: -1, y: -1 },
      nodes: [],
      t: 0,
      last: 0,
      paused: false,
    };

    const palette = ['#8de8ff', '#b4c7ff', '#ff94d7', '#d1ff72', '#9ce0ff'];
    let rand = rngFromSeed(state.seed);

    density.value = String(state.density);
    chaos.value = String(state.chaos);
    heat.value = String(state.heat);

    function clamp(v, min, max) {
      if (!Number.isFinite(v)) return min;
      return Math.min(max, Math.max(min, Math.round(v)));
    }

    function syncHash() {
      const url = new URL(window.location.href);
      const next = new URLSearchParams();
      next.set('seed', String(state.seed));
      next.set('density', String(state.density));
      next.set('chaos', String(state.chaos));
      next.set('heat', String(state.heat));
      next.set('m', state.mode || 'drift');
      url.hash = next.toString();
      history.replaceState({}, '', url.toString());
    }

    function seedFromString(s) {
      let total = 0;
      for (let i = 0; i < s.length; i++) {
        total = (total * 31 + s.charCodeAt(i)) >>> 0;
      }
      return total % 2147483647;
    }

    function buildNodes() {
      state.nodes.length = 0;
      const count = state.density;
      const cx = canvas.width * 0.5;
      const cy = canvas.height * 0.5;
      const radius = Math.min(canvas.width, canvas.height) * 0.34;
      for (let i = 0; i < count; i++) {
        const r = (i / count) * Math.PI * 2;
        const drift = (rand() - 0.5) * Math.PI * 2;
        state.nodes.push({
          angle: r + drift,
          radius: radius * (0.18 + rand() * 0.82),
          speed: 0.0026 + rand() * 0.007 + (state.heat - 50) * 0.00002,
          jitter: rand() * Math.PI * 2,
          phase: rand() * Math.PI * 2,
          amp: 0.4 + rand() * 0.9,
          weight: 1 + rand() * 0.8,
        });
      }
      state.mode = 'drift';
      modeLine.textContent = `mode: ${state.mode}`;
      statusLine.textContent = `status: seeded (${state.nodes.length})`;
      seedLine.textContent = `seed: ${state.seed}`;
      syncHash();
    }

    function resize() {
      const dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      const rect = canvas.getBoundingClientRect();
      canvas.width = Math.max(1, Math.round(rect.width * dpr));
      canvas.height = Math.max(1, Math.round(rect.height * dpr));
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      buildNodes();
    }

    function pointerPos(e) {
      const rect = canvas.getBoundingClientRect();
      if (e.touches && e.touches[0]) {
        return {
          x: e.touches[0].clientX - rect.left,
          y: e.touches[0].clientY - rect.top,
        };
      }
      return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top,
      };
    }

    function injectPulse(x, y) {
      const cx = canvas.width / (2 * ctx.getTransform().a);
      const cy = canvas.height / (2 * ctx.getTransform().a);
      for (let i = 0; i < state.nodes.length; i++) {
        const n = state.nodes[i];
        const nx = Math.cos(n.angle) * n.radius + cx;
        const ny = Math.sin(n.angle) * n.radius + cy;
        const dx = nx - x;
        const dy = ny - y;
        const d = Math.hypot(dx, dy);
        if (d < 160) {
          const hit = (160 - d) / 160;
          n.radius += hit * 45;
          n.amp += hit * 0.9;
          n.jitter += hit * Math.PI * 1.2;
        }
      }
    }

    function draw(time) {
      if (!state.paused) {
        state.t = time * 0.001;
      }

      const width = canvas.width / ctx.getTransform().a;
      const height = canvas.height / ctx.getTransform().a;
      const cx = width / 2;
      const cy = height / 2;
      const baseRadius = Math.min(width, height) * 0.34;
      const chaosFactor = state.chaos / 120;
      const heatFactor = state.heat / 160;

      const fieldColor = 24 + Math.round(heatFactor * 55);
      ctx.clearRect(0, 0, width, height);
      ctx.fillStyle = `rgb(${Math.max(3, 6 + fieldColor)}, ${Math.max(9, 10 + fieldColor)}, ${Math.max(20, 25 + fieldColor)})`;
      ctx.fillRect(0, 0, width, height);

      for (let i = 0; i < state.nodes.length; i++) {
        const node = state.nodes[i];
        node.angle += node.speed * (1 + chaosFactor * 1.8);
        node.radius += Math.sin(node.jitter + state.t * 0.6) * (0.15 + heatFactor * 0.7);
        node.radius = Math.min(baseRadius, Math.max(baseRadius * 0.15, node.radius));
        node.jitter += 0.01 + node.amp * 0.01;
        node.phase += 0.0008 * (1 + heatFactor * 1.2);
        node.amp = Math.max(0.2, node.amp * 0.996);
        if (node.radius > baseRadius * 0.83 && rand() < 0.01 + chaosFactor * 0.02) {
          node.radius *= 0.62;
          node.amp += 0.6;
        }
      }

      state.nodes.sort((a, b) => a.radius - b.radius);

      for (let i = 0; i < state.nodes.length; i++) {
        const p = state.nodes[i];
        const px = Math.cos(p.angle) * p.radius + cx;
        const py = Math.sin(p.angle) * p.radius + cy;

        if (state.pointer.x >= 0 && state.pointer.y >= 0) {
          const d = Math.hypot(px - state.pointer.x, py - state.pointer.y);
          if (d < 170) {
            const hit = 1 - d / 170;
            const nudge = hit * 0.022;
            p.angle += (state.pointer.x - px) * 0.00004 * nudge;
            p.radius += nudge * 25;
            p.phase += 0.08 * hit;
          }
        }

        ctx.strokeStyle = `rgba(141, 232, 255, ${0.06 + p.amp * 0.08})`;
        ctx.lineWidth = 1;
        if (i < state.nodes.length - 1) {
          const q = state.nodes[i + 1];
          const qx = Math.cos(q.angle) * q.radius + cx;
          const qy = Math.sin(q.angle) * q.radius + cy;
          const phase = (Math.sin(p.phase) + 1) * 0.5;
          ctx.beginPath();
          ctx.moveTo(px, py);
          const mx = (px + qx) / 2 + Math.cos(p.jitter + state.t) * 8;
          const my = (py + qy) / 2 + Math.sin(q.phase + state.t) * 8;
          ctx.quadraticCurveTo(mx, my, qx, qy);
          ctx.strokeStyle = palette[(i + Math.floor(heatFactor * 10)) % palette.length];
          ctx.globalAlpha = 0.2 + p.amp * 0.25 + phase * 0.15;
          ctx.stroke();
          ctx.globalAlpha = 1;
        }

        const radiusPulse = 2 + (p.amp * 2) + chaosFactor * 2.2 + Math.sin(p.phase + state.t) * 0.5;
        const pulseA = 0.45 + (Math.sin(p.phase * 1.8 + state.t) + 1) * 0.25;
        ctx.fillStyle = `rgba(255, 148, 215, ${pulseA})`;
        ctx.beginPath();
        ctx.arc(px, py, radiusPulse, 0, Math.PI * 2);
        ctx.fill();
      }

      ctx.globalCompositeOperation = 'lighter';
      for (let i = 0; i < state.nodes.length; i += 2) {
        const p = state.nodes[i];
        const px = Math.cos(p.angle) * p.radius + cx;
        const py = Math.sin(p.angle) * p.radius + cy;
        ctx.strokeStyle = `rgba(209, 255, 114, ${0.2 + (i / state.nodes.length) * 0.25})`;
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        const q = state.nodes[(i * 7) % state.nodes.length];
        const qx = Math.cos(q.angle) * q.radius + cx;
        const qy = Math.sin(q.angle) * q.radius + cy;
        ctx.lineTo(px, py);
        ctx.lineTo(qx, qy);
        ctx.stroke();
      }
      ctx.globalCompositeOperation = 'source-over';

      // radial glow halo
      const pulse = (Math.sin(state.t * 0.4) + 1) * 0.45;
      const ring = baseRadius * (0.18 + heatFactor * 0.08 + chaosFactor * 0.02);
      ctx.strokeStyle = `rgba(141, 232, 255, ${0.2 + pulse * 0.1})`;
      ctx.lineWidth = 1.5;
      for (let i = 0; i < 5; i++) {
        ctx.beginPath();
        ctx.arc(cx, cy, ring + i * 24, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (state.paused) {
        ctx.fillStyle = 'rgba(255,255,255,0.76)';
        ctx.font = 'bold 16px Trebuchet MS, Segoe UI, sans-serif';
        ctx.fillText('PAUSED', 12, 24);
        statusLine.textContent = 'status: paused';
      } else {
        statusLine.textContent = `status: live · nodes ${state.nodes.length}`;
      }

      requestAnimationFrame(draw);
    }

    canvas.addEventListener('pointermove', (event) => {
      const p = pointerPos(event);
      state.pointer.x = p.x;
      state.pointer.y = p.y;
      if (event.buttons) injectPulse(p.x, p.y);
    });

    canvas.addEventListener('pointerleave', () => {
      state.pointer.x = -1;
      state.pointer.y = -1;
    });

    canvas.addEventListener('pointerdown', (event) => {
      event.preventDefault();
      const p = pointerPos(event);
      injectPulse(p.x, p.y);
    });

    density.addEventListener('input', () => {
      state.density = Number(density.value);
      buildNodes();
    });

    chaos.addEventListener('input', () => {
      state.chaos = Number(chaos.value);
      syncHash();
    });

    heat.addEventListener('input', () => {
      state.heat = Number(heat.value);
      syncHash();
    });

    pauseBtn.addEventListener('click', () => {
      state.paused = !state.paused;
      pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
      if (!state.paused) {
        state.last = performance.now();
      }
    });

    reseedBtn.addEventListener('click', () => {
      const seedText = String(Math.floor(Math.random() * 2147483647));
      state.seed = makeSeed(seedText);
      rand = rngFromSeed(state.seed);
      buildNodes();
      syncHash();
      if (typeof statusLine !== 'undefined') {
        statusLine.textContent = `status: reseeded ${state.seed}`;
      }
    });

    copyBtn.addEventListener('click', async () => {
      syncHash();
      try {
        await navigator.clipboard.writeText(window.location.href);
        const prev = copyBtn.textContent;
        copyBtn.textContent = 'Copied ✓';
        setTimeout(() => (copyBtn.textContent = prev), 1400);
      } catch {
        const prev = copyBtn.textContent;
        copyBtn.textContent = 'Copy blocked';
        setTimeout(() => (copyBtn.textContent = prev), 1400);
      }
    });

    saveBtn.addEventListener('click', () => {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `lattice-murmur-${Date.now()}.png`;
      a.click();
    });

    window.addEventListener('resize', () => {
      resize();
    });

    const keyMap = {
      '+': () => {
        density.value = String(Math.min(240, state.density + 8));
        state.density = Number(density.value);
        buildNodes();
      },
      '-': () => {
        density.value = String(Math.max(40, state.density - 8));
        state.density = Number(density.value);
        buildNodes();
      },
      ' ': () => {
        state.paused = !state.paused;
        pauseBtn.textContent = state.paused ? 'Resume' : 'Pause';
      },
      r: () => {
        reseedBtn.click();
      },
    };

    window.addEventListener('keydown', (event) => {
      const fn = keyMap[event.key];
      if (!fn) return;
      fn();
      event.preventDefault();
    });

    state.seed = clamp(state.seed, 1, 2147483646);
    rand = rngFromSeed(state.seed);
    buildNodes();
    resize();
    requestAnimationFrame(draw);
  </script>
</body>
</html>
