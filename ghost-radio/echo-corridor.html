<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Echo Corridor</title>
  <meta name="description" content="Echo Corridor is a seeded, interactive corridor sketch where particles braid into ghostly routes and react to your cursor." />
  <meta name="theme-color" content="#090b12" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="Echo Corridor" />
  <meta property="og:description" content="A pointer-reactive corridor of deterministic echoes with chaos, density, and speed controls." />
  <meta property="og:url" content="https://garytalbot.github.io/ghost-radio/echo-corridor.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Echo Corridor" />
  <meta name="twitter:description" content="Pointer-reactive particle corridor with shareable seed controls." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a10;
      --line: rgba(255, 255, 255, 0.16);
      --ink: #eef2ff;
      --muted: #a5b3cb;
      --a: #8de8ff;
      --b: #ff94d7;
      --c: #d1ff72;
      --panel: rgba(11, 13, 24, 0.62);
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
    body {
      background:
        radial-gradient(circle at 18% 12%, rgba(141, 232, 255, 0.16), transparent 24%),
        radial-gradient(circle at 84% 8%, rgba(255, 148, 215, 0.12), transparent 22%),
        radial-gradient(circle at 50% 82%, rgba(209, 255, 114, 0.1), transparent 36%),
        linear-gradient(180deg, #090b12 0%, #05070e 82%, #02030a 100%);
      color: var(--ink);
      font: 15px/1.45 "Trebuchet MS", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    .panel {
      position: fixed;
      z-index: 2;
      top: 10px;
      left: 10px;
      max-width: min(930px, calc(100vw - 20px));
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(12px);
      box-shadow: 0 18px 60px rgba(0,0,0,0.45);
    }

    .panel h1 {
      margin: 0 0 4px;
      font: 700 1rem/1.2 "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .panel p {
      margin: 0 0 9px;
      color: var(--muted);
      max-width: 68ch;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    .row.tight { gap: 6px; }

    button, a {
      appearance: none;
      border: 1px solid rgba(255,255,255,.16);
      background: rgba(255,255,255,.04);
      color: #fff;
      border-radius: 999px;
      padding: 8px 11px;
      font: 700 .8rem/1 "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: .02em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: transform 120ms ease, border-color 120ms ease, box-shadow 120ms ease;
      white-space: nowrap;
    }

    button:hover, a:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--a) 40%, white 60%);
      box-shadow: 0 0 0 2px rgba(141, 232, 255, 0.18);
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid var(--a);
      outline-offset: 2px;
    }

    .active {
      background: linear-gradient(135deg, rgba(141,232,255,.22), rgba(255,148,215,.14));
      border-color: color-mix(in srgb, var(--b) 46%, white 54%);
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #a2b0cb;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-size: .76rem;
      margin: 5px 0;
    }

    input[type="range"] { width: 180px; }

    .small {
      font-size: .73rem;
      color: #b8c5e2;
      text-transform: uppercase;
      letter-spacing: .09em;
      margin-top: 2px;
    }

    .stats {
      margin-top: 6px;
      display: grid;
      gap: 4px;
      color: var(--muted);
      font-size: .84rem;
    }

    .stats span { color: #e9f0ff; margin-left: 6px; }

    @media (max-width: 760px) {
      .panel { max-width: calc(100vw - 16px); }
      button, a { padding: 8px 10px; font-size: .74rem; }
      input[type="range"] { width: 140px; }
      .stats { font-size: .76rem; }
    }
  </style>
</head>
<body>
  <canvas id="corridor"></canvas>

  <section class="panel" aria-label="Echo Corridor controls">
    <h1>Echo Corridor</h1>
    <p>
      A haunted corridor where deterministic echoes braid in and out of your cursor. Tuning one
      seed remixes the whole route map.
    </p>

    <div class="row">
      <button id="pauseBtn" type="button" data-state="play">Pause</button>
      <button id="reseedBtn" type="button">Rerandomize seed</button>
      <button id="copyBtn" type="button">Copy seed link</button>
      <button id="saveBtn" type="button">Save frame</button>
      <a href="./" rel="noopener noreferrer">Return to Ghost Radio</a>
    </div>

    <div>
      <label>
        Corridor density
        <input id="density" type="range" min="0.35" max="1.65" value="0.95" step="0.01" />
        <span id="densityLabel">0.95</span>
      </label>
    </div>
    <div>
      <label>
        Corridor chaos
        <input id="chaos" type="range" min="0" max="1.6" value="0.72" step="0.01" />
        <span id="chaosLabel">0.72</span>
      </label>
    </div>
    <div>
      <label>
        Corridor speed
        <input id="speed" type="range" min="0.35" max="2.2" value="1.05" step="0.01" />
        <span id="speedLabel">1.05</span>
      </label>
    </div>

    <div class="stats" aria-live="polite">
      Seed: <span id="seedLabel">—</span><br>
      Frames: <span id="frameLabel">0</span><br>
      State: <span id="stateLabel">live</span>
    </div>

    <div class="small">Tip: click or drag on the field to spawn a flare that rethreads nearby trajectories.</div>
  </section>

  <script>
    const canvas = document.getElementById('corridor');
    const ctx = canvas.getContext('2d', { alpha: true });

    const pauseBtn = document.getElementById('pauseBtn');
    const reseedBtn = document.getElementById('reseedBtn');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const density = document.getElementById('density');
    const densityLabel = document.getElementById('densityLabel');
    const chaos = document.getElementById('chaos');
    const chaosLabel = document.getElementById('chaosLabel');
    const speed = document.getElementById('speed');
    const speedLabel = document.getElementById('speedLabel');
    const seedLabel = document.getElementById('seedLabel');
    const frameLabel = document.getElementById('frameLabel');
    const stateLabel = document.getElementById('stateLabel');

    let paused = false;
    let frame = 0;
    let width = 0;
    let height = 0;
    let dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));

    let params = loadParams();
    let particles = [];
    let pointer = { x: 0, y: 0, active: false, lastX: 0, lastY: 0 };

    function parseFloatSafe(v, fallback) {
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    function clamp(value, min, max, fallback) {
      if (!Number.isFinite(value)) return fallback;
      return Math.min(max, Math.max(min, value));
    }

    function loadParams() {
      const q = new URLSearchParams(location.search);
      const seed = parseFloatSafe(q.get('seed'), Math.floor(Math.random() * 999999));
      const densityRaw = parseFloatSafe(q.get('density'), 0.95);
      const chaosRaw = parseFloatSafe(q.get('chaos'), 0.72);
      const speedRaw = parseFloatSafe(q.get('speed'), 1.05);
      return {
        seed: Math.floor(Math.abs(seed || 1)),
        density: clamp(densityRaw, 0.35, 1.65, 0.95),
        chaos: clamp(chaosRaw, 0, 1.6, 0.72),
        speed: clamp(speedRaw, 0.35, 2.2, 1.05),
      };
    }

    function mixInt(seed) {
      let s = seed >>> 0;
      return function rand() {
        s ^= s << 13;
        s ^= s >>> 17;
        s ^= s << 5;
        return ((s >>> 0) / 4294967296);
      };
    }

    function makeSeeded(seed, fallback = 12345) {
      const n = Math.abs(Math.floor(seed || fallback));
      return mixInt(n || 1);
    }

    function r(min, max) {
      return min + rand() * (max - min);
    }

    let rand = makeSeeded(params.seed);

    class Particle {
      constructor() {
        this.reset(true);
      }

      reset(teleport = false) {
        this.x = r(0, width);
        this.y = r(0, height);
        this.vx = r(-0.55, 0.55);
        this.vy = r(-0.55, 0.55);
        this.life = Math.floor(220 + r(0, 280));
        this.mass = 0.5 + r(0, 2.6);
        this.wobble = r(0, Math.PI * 2);
        this.hue = rand() > 0.5 ? 0 : 1;
        if (!teleport && pointer.active) {
          this.x = pointer.x + r(-35, 35);
          this.y = pointer.y + r(-35, 35);
          this.life = Math.floor(320 + r(0, 300));
        }
      }

      step(t) {
        const nx = (this.x / width - 0.5) * 2;
        const ny = (this.y / height - 0.5) * 2;
        const ring = Math.atan2(ny, nx);
        const mag = 0.45 + Math.hypot(nx, ny);
        const pull = Math.sin((ring * 2) + t * 0.00012 * params.speed + this.wobble);
        this.wobble += 0.002 * (params.speed + this.mass);

        this.vx += Math.cos(ring + pull * params.chaos) * 0.022 * params.speed;
        this.vy += Math.sin(ring * 1.4 - pull * params.chaos) * 0.018 * params.speed;

        const dx = this.x - pointer.x;
        const dy = this.y - pointer.y;
        if (pointer.active) {
          const distSq = dx * dx + dy * dy;
          if (distSq < 20000) {
            const dist = Math.sqrt(distSq) || 1;
            const force = (1 / dist) * 30 * (params.chaos + 0.2);
            this.vx += (-dx / dist) * force * 0.0015;
            this.vy += (-dy / dist) * force * 0.0015;
            this.life += 2;
          }
        }

        const noise = Math.sin((t * 0.002 + this.wobble) * params.speed) * params.chaos * 0.18;
        this.vx += noise * 0.012;
        this.vy += Math.cos((t * 0.003 + this.wobble) * params.speed) * 0.012 * params.chaos;

        this.vx *= 0.992;
        this.vy *= 0.992;
        const vscale = 2.2 + this.mass;
        this.x += this.vx * vscale;
        this.y += this.vy * vscale;

        this.life -= 1;
        if (this.life <= 0 || this.x < -30 || this.x > width + 30 || this.y < -30 || this.y > height + 30 || mag > 1.7) {
          this.reset(false);
        }
      }

      draw() {
        const alpha = Math.max(0.14, this.life / 420);
        const palette = this.hue ? ['#8de8ff', '#ff94d7', '#d1ff72'] : ['#d1ff72', '#8de8ff', '#ff94d7'];
        const col = palette[Math.floor((this.wobble * 8) % palette.length)];
        ctx.fillStyle = `rgba(${parseInt(col.slice(1,3),16)},${parseInt(col.slice(3,5),16)},${parseInt(col.slice(5,7),16)},${alpha})`;
        ctx.beginPath();
        ctx.ellipse(this.x, this.y, 1.15 + this.mass * 0.24, 1.05 + this.mass * 0.2, 0, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    function resize() {
      width = Math.max(1, Math.floor(innerWidth));
      height = Math.max(1, Math.floor(innerHeight));
      dpr = Math.max(1, Math.min(2, window.devicePixelRatio || 1));
      canvas.width = Math.floor(width * dpr);
      canvas.height = Math.floor(height * dpr);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function buildPopulation() {
      const count = Math.floor(350 * params.density);
      particles = new Array(Math.max(120, count)).fill(0).map(() => new Particle());
      seedLabel.textContent = String(params.seed);
      density.value = params.density.toFixed(2);
      chaos.value = params.chaos.toFixed(2);
      speed.value = params.speed.toFixed(2);
      densityLabel.textContent = params.density.toFixed(2);
      chaosLabel.textContent = params.chaos.toFixed(2);
      speedLabel.textContent = params.speed.toFixed(2);
    }

    function writeState() {
      const q = new URLSearchParams();
      q.set('seed', String(params.seed));
      q.set('density', params.density.toFixed(2));
      q.set('chaos', params.chaos.toFixed(2));
      q.set('speed', params.speed.toFixed(2));
      const next = `${location.pathname}?${q.toString()}`;
      history.replaceState(null, '', next);
    }

    function randomizeSeed() {
      params.seed = Math.floor(Math.random() * 999999) + 1;
      rand = makeSeeded(params.seed);
      buildPopulation();
      writeState();
      reseedBtn.classList.add('active');
      setTimeout(() => reseedBtn.classList.remove('active'), 250);
    }

    function copySeedLink() {
      const url = new URL(location.href);
      navigator.clipboard?.writeText(url.toString()).then(() => {
        copyBtn.classList.add('active');
        copyBtn.textContent = 'Copied';
        setTimeout(() => {
          copyBtn.classList.remove('active');
          copyBtn.textContent = 'Copy seed link';
        }, 900);
      }).catch(() => {
        copyBtn.textContent = 'Copy failed';
        setTimeout(() => copyBtn.textContent = 'Copy seed link', 900);
      });
    }

    function saveFrame() {
      const link = document.createElement('a');
      link.download = `echo-corridor-${params.seed}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    function setDensity() {
      params.density = clamp(parseFloatSafe(density.value, params.density), 0.35, 1.65, params.density);
      densityLabel.textContent = params.density.toFixed(2);
      buildPopulation();
      writeState();
    }

    function setChaos() {
      params.chaos = clamp(parseFloatSafe(chaos.value, params.chaos), 0, 1.6, params.chaos);
      chaosLabel.textContent = params.chaos.toFixed(2);
      writeState();
    }

    function setSpeed() {
      params.speed = clamp(parseFloatSafe(speed.value, params.speed), 0.35, 2.2, params.speed);
      speedLabel.textContent = params.speed.toFixed(2);
      writeState();
    }

    function togglePaused() {
      paused = !paused;
      if (paused) {
        pauseBtn.textContent = 'Resume';
        pauseBtn.classList.add('active');
        stateLabel.textContent = 'paused';
      } else {
        pauseBtn.textContent = 'Pause';
        pauseBtn.classList.remove('active');
        stateLabel.textContent = 'live';
      }
    }

    function pointerUpdate(e) {
      const p = e.touches && e.touches[0] ? e.touches[0] : e;
      const rect = canvas.getBoundingClientRect();
      pointer.x = p.clientX - rect.left;
      pointer.y = p.clientY - rect.top;
      pointer.active = true;
      pointer.lastX = pointer.x;
      pointer.lastY = pointer.y;

      for (let i = 0; i < 7; i += 1) {
        const p = new Particle();
        p.x = pointer.x + r(-40, 40);
        p.y = pointer.y + r(-40, 40);
        p.life = Math.floor(400 + r(0, 260));
        particles.push(p);
      }

      if (particles.length > 2200) {
        particles.splice(0, particles.length - 2200);
      }
    }

    function pointerLeave() {
      pointer.active = false;
    }

    function drawField() {
      frame += 1;
      frameLabel.textContent = String(frame);
      if (paused) return;

      ctx.fillStyle = 'rgba(6,8,14,0.12)';
      ctx.fillRect(0, 0, width, height);

      const t = performance.now();
      for (let i = 0; i < particles.length; i += 1) {
        const p = particles[i];
        p.step(t);
        p.draw();
      }

      ctx.fillStyle = 'rgba(255,255,255,0.4)';
      ctx.beginPath();
      ctx.arc(pointer.x, pointer.y, pointer.active ? 11 : 8, 0, Math.PI * 2);
      ctx.fill();
    }

    function boot() {
      resize();
      buildPopulation();
      writeState();
      stateLabel.textContent = paused ? 'paused' : 'live';
      frame = 0;
      lastTs = 0;
      ctx.fillStyle = 'rgba(8,10,16,1)';
      ctx.fillRect(0,0,width,height);
      requestAnimationFrame(tick);
    }

    let lastTs = 0;
    function tick(ts) {
      if (!lastTs) lastTs = ts;
      drawField();
      lastTs = ts;
      requestAnimationFrame(tick);
    }

    pauseBtn.addEventListener('click', togglePaused);
    reseedBtn.addEventListener('click', randomizeSeed);
    copyBtn.addEventListener('click', copySeedLink);
    saveBtn.addEventListener('click', saveFrame);
    density.addEventListener('input', setDensity);
    chaos.addEventListener('input', setChaos);
    speed.addEventListener('input', setSpeed);

    window.addEventListener('resize', () => {
      resize();
      buildPopulation();
    });

    window.addEventListener('mousemove', pointerUpdate);
    window.addEventListener('touchmove', (ev) => {
      if (ev.touches?.length) {
        pointerUpdate(ev);
        ev.preventDefault();
      }
    }, { passive: false });
    window.addEventListener('touchstart', (ev) => {
      if (ev.touches?.length) {
        pointerUpdate(ev);
        ev.preventDefault();
      }
    }, { passive: false });
    window.addEventListener('mouseleave', pointerLeave);
    window.addEventListener('mouseup', pointerLeave);
    window.addEventListener('touchend', pointerLeave);

    boot();
  </script>
</body>
</html>
