<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta
    name="description"
    content="Resonant Spiral is a haunted Ghost Radio side chamber where pointer-driven threads drift into recursive signal spirals."
  />
  <meta name="theme-color" content="#090b12" />
  <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
  <title>Resonant Spiral — Ghost Radio</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a12;
      --line: rgba(255, 255, 255, 0.12);
      --text: #f2f6ff;
      --muted: #a2b2d6;
      --a: #8de8ff;
      --b: #ff94d7;
      --c: #d1ff72;
    }

    * { box-sizing: border-box; }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background:
        radial-gradient(circle at 20% 14%, rgba(141, 232, 255, .15), transparent 30%),
        radial-gradient(circle at 82% 18%, rgba(255, 148, 215, .12), transparent 27%),
        radial-gradient(circle at 50% 78%, rgba(209, 255, 114, .08), transparent 28%),
        linear-gradient(180deg, #070a12 0%, #090b12 52%, #05060b 100%);
      color: var(--text);
      font-family: "Trebuchet MS", "Segoe UI", sans-serif;
      overflow: hidden;
    }

    .shell {
      width: min(1120px, 100vw - 16px);
      margin: 8px auto;
      display: grid;
      gap: 10px;
      min-height: calc(100vh - 16px);
    }

    .toolbar {
      display: grid;
      gap: 10px;
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: rgba(12, 14, 22, 0.62);
      backdrop-filter: blur(8px);
    }

    .toolbar h1 {
      margin: 0;
      font-size: 1.08rem;
      letter-spacing: .07em;
      text-transform: uppercase;
    }

    .toolbar p {
      margin: 0;
      color: var(--muted);
      max-width: 70ch;
      line-height: 1.35;
      font-size: .88rem;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    label, button, .ghost-link {
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border-radius: 999px;
      font: inherit;
      padding: 8px 11px;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      white-space: nowrap;
    }

    input[type="range"] {
      width: 160px;
      accent-color: var(--a);
      padding: 0;
    }

    .muted-link {
      text-decoration: none;
      color: #d7e5ff;
      white-space: nowrap;
    }

    button { cursor: pointer; }
    button:hover { border-color: color-mix(in srgb, var(--a) 45%, white 55%); }

    .stage {
      position: relative;
      border: 1px solid var(--line);
      border-radius: 14px;
      min-height: calc(100vh - 234px);
      overflow: hidden;
      background:
        radial-gradient(circle at 50% 40%, rgba(255,255,255,.06), transparent 60%),
        linear-gradient(140deg, rgba(141,232,255,.04), rgba(255,148,215,.03));
    }

    canvas {
      width: 100%;
      height: 100%;
      display: block;
      image-rendering: auto;
    }

    .status {
      position: absolute;
      inset: 10px;
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
      pointer-events: none;
      z-index: 2;
    }

    .status span {
      font-size: .78rem;
      padding: 6px 10px;
      border-radius: 8px;
      color: #d7e4ff;
      background: rgba(0,0,0,.42);
      border: 1px solid rgba(255,255,255,.14);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .status .live {
      justify-self: end;
      color: #fff;
    }

    .sr-only {
      position: absolute !important;
      width: 1px;
      height: 1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
    }

    @media (max-width: 760px) {
      .toolbar { gap: 8px; }
      .controls { gap: 6px; }
      label { flex: 1 1 100%; }
      .muted-link, button { flex: 1 1 auto; justify-content: center; }
      input[type="range"] { width: 120px; }
      .status { grid-template-columns: 1fr; }
      .status .live { justify-self: start; }
    }
  </style>
</head>
<body>
  <main class="shell" aria-label="Resonant Spiral chamber">
    <section class="toolbar">
      <h1>Resonant Spiral</h1>
      <p>
        Pointer pulls the static into loops. This side chamber generates a deterministic swarm of
        spectral threads from a seed, then lets you stir it with cursor gravity and chaos.
      </p>
      <div class="controls">
        <label for="density">Density <input id="density" type="range" min="18" max="220" value="96" /></label>
        <label for="drift">Drift <input id="drift" type="range" min="0.4" max="4" step="0.1" value="1.8" /></label>
        <label for="chaos">Chaos <input id="chaos" type="range" min="0.15" max="2.3" step="0.05" value="0.9" /></label>
        <button id="pauseBtn" type="button">Pause</button>
        <button id="reseedBtn" type="button">Reseed</button>
        <button id="copyBtn" type="button">Copy share link</button>
        <button id="saveBtn" type="button">Save PNG</button>
        <a class="ghost-link muted-link" href="./">← Back to Ghost Radio</a>
      </div>
    </section>

    <section class="stage" aria-label="Resonant spiral canvas">
      <canvas id="spiral" role="img" aria-label="Animated resonant spiral field"></canvas>
      <div class="status">
        <span id="seedLine">seed: not set</span>
        <span id="liveLine" class="live">state: starting</span>
      </div>
    </section>
    <div id="liveRegion" class="sr-only" aria-live="polite"></div>
  </main>

  <script>
    const canvas = document.getElementById('spiral');
    const ctx = canvas.getContext('2d');
    const densityEl = document.getElementById('density');
    const driftEl = document.getElementById('drift');
    const chaosEl = document.getElementById('chaos');
    const pauseBtn = document.getElementById('pauseBtn');
    const reseedBtn = document.getElementById('reseedBtn');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const seedLine = document.getElementById('seedLine');
    const liveLine = document.getElementById('liveLine');
    const liveRegion = document.getElementById('liveRegion');

    const DPR = Math.min(window.devicePixelRatio || 1, 2);
    const palette = ['#8de8ff', '#ff94d7', '#d1ff72', '#9fe8ff', '#ffc2ff', '#b5ffa6'];
    const state = {
      seed: 0,
      running: true,
      density: Number(densityEl.value),
      drift: Number(driftEl.value),
      chaos: Number(chaosEl.value),
      pointer: null,
      time: 0,
      frame: 0,
      particles: []
    };

    let resizeObserver = null;

    function hashParams() {
      const raw = new URLSearchParams(location.hash.slice(1));
      const pick = (key, fallback) => {
        const value = raw.get(key);
        if (value === null) return fallback;
        const n = Number(value);
        return Number.isFinite(n) ? n : fallback;
      };
      return {
        seed: pick('seed', Math.floor(Math.random() * 2147483647)),
        density: Math.max(12, Math.min(260, Math.round(pick('d', 96)))),
        drift: Math.max(0.2, Math.min(5, pick('s', 1.8))),
        chaos: Math.max(0.1, Math.min(3, pick('c', 0.9))),
        paused: !!raw.get('p')
      };
    }

    function syncUIFromState() {
      densityEl.value = String(state.density);
      driftEl.value = String(state.drift);
      chaosEl.value = String(state.chaos);
    }

    function syncHash() {
      const p = new URLSearchParams();
      p.set('seed', String(state.seed));
      p.set('d', String(state.density));
      p.set('s', String(state.drift));
      p.set('c', String(state.chaos.toFixed(2)));
      if (!state.running) p.set('p', '1');
      history.replaceState(null, '', `#${p.toString()}`);
    }

    function mulberry32(a) {
      return function() {
        let t = a += 0x6D2B79F5;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function spawn(seed) {
      const rand = mulberry32(seed >>> 0);
      const min = Math.min(innerWidth, innerHeight);
      const count = state.density;
      state.particles = new Array(count).fill(0).map((_, i) => {
        const angle = rand() * Math.PI * 2;
        const ring = (i / count) * Math.PI * 2;
        const radius = (0.17 + 0.82 * rand()) * Math.min(innerWidth, innerHeight) * 0.44;
        const phase = rand() * Math.PI * 2;
        return {
          x: innerWidth / 2 + Math.cos(angle) * radius + (rand() - 0.5) * 20,
          y: innerHeight / 2 + Math.sin(angle) * radius + (rand() - 0.5) * 20,
          vx: Math.cos(phase) * 0.15,
          vy: Math.sin(phase) * 0.15,
          spin: (rand() - 0.5) * 0.9,
          trail: [],
          radius: 1 + rand() * 1.8,
          hue: rand() * 360,
          speed: 0.003 + rand() * 0.01,
          life: 140 + rand() * 220
        };
      });
      seedLine.textContent = `seed: ${state.seed}`;
      state.time = 0;
      state.frame = 0;
    }

    function resize() {
      const width = window.innerWidth;
      const height = window.innerHeight;
      canvas.width = Math.floor(width * DPR);
      canvas.height = Math.floor(height * DPR);
      canvas.style.width = `${width}px`;
      canvas.style.height = `${height}px`;
      ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
      spawn(state.seed);
    }

    function fieldForce(x, y, t) {
      const cx = innerWidth * 0.5;
      const cy = innerHeight * 0.5;
      const dx = x - cx;
      const dy = y - cy;
      const dist = Math.hypot(dx, dy) || 1;
      const u = dx / dist;
      const v = dy / dist;
      const swirl = Math.sin((dist * 0.0035) - t * 1.1) * 0.6 + Math.cos(t * 0.6 + dist * 0.002);
      const pulse = Math.cos((t + x * 0.0008) * 0.9);
      return {
        fx: -v * swirl * state.chaos - u * 0.018 * pulse,
        fy: u * swirl * state.chaos - v * 0.018 * pulse
      };
    }

    function pointerForce(x, y, p) {
      if (!p) return { fx: 0, fy: 0 };
      const dx = p.x - x;
      const dy = p.y - y;
      const dist = Math.hypot(dx, dy) || 1;
      const pull = Math.min(90 / dist, 1.8) * 0.08 * (state.chaos + 0.2);
      return {
        fx: (dx / dist) * pull,
        fy: (dy / dist) * pull
      };
    }

    function drawBackground() {
      const fade = 0.08 + Math.min(0.18, state.chaos * 0.05);
      ctx.fillStyle = `rgba(6,9,14,${fade})`;
      ctx.fillRect(0, 0, innerWidth, innerHeight);
    }

    function step() {
      if (!state.running) {
        requestAnimationFrame(step);
        return;
      }
      const dt = 1;
      state.time += dt * state.drift * 0.004;
      state.frame += 1;
      drawBackground();

      const t = state.time;
      const cx = innerWidth / 2;
      const cy = innerHeight / 2;

      for (let i = 0; i < state.particles.length; i++) {
        const p = state.particles[i];
        const f = fieldForce(p.x, p.y, t + p.speed * state.time * 110);
        const g = pointerForce(p.x, p.y, state.pointer);
        const attract = Math.sin(t * 2.5 + p.spin + i * 0.13) * 0.6;

        p.vx += (f.fx + g.fx + attract * 0.0009) * dt;
        p.vy += (f.fy + g.fy + attract * 0.0009) * dt;

        p.vx += Math.cos(t * 0.9 + p.hue) * 0.0008 * state.drift;
        p.vy += Math.sin(t * 0.8 + p.hue * 0.8) * 0.0008 * state.drift;

        // damping and spin
        p.vx *= 0.985;
        p.vy *= 0.985;

        p.x += p.vx * 9 * (1 + (state.chaos - 0.9));
        p.y += p.vy * 9 * (1 + (state.chaos - 0.9));

        const spin = state.chaos * 0.003;
        const ox = p.x - cx;
        const oy = p.y - cy;
        p.x += -oy * spin + Math.cos(p.spin) * 0.12 * state.drift;
        p.y += ox * spin + Math.sin(p.spin) * 0.12 * state.drift;

        if (p.x < -20) p.x = innerWidth + 20;
        if (p.x > innerWidth + 20) p.x = -20;
        if (p.y < -20) p.y = innerHeight + 20;
        if (p.y > innerHeight + 20) p.y = -20;

        p.trail.push({ x: p.x, y: p.y, h: p.hue });
        if (p.trail.length > 36) p.trail.shift();

        const localAge = (state.frame + i * 12) % p.life;
        const alpha = 0.25 + (localAge / p.life) * 0.55;
        const color = `hsla(${(p.hue + localAge * 0.18) % 360}, 88%, 68%, ${alpha})`;

        ctx.strokeStyle = color;
        ctx.lineWidth = 1 + p.radius * 0.6;
        ctx.beginPath();
        for (let j = 0; j < p.trail.length; j++) {
          const q = p.trail[j];
          if (j === 0) ctx.moveTo(q.x, q.y);
          else ctx.lineTo(q.x, q.y);
        }
        ctx.stroke();

        if (state.pointer) {
          const dxp = p.x - state.pointer.x;
          const dyp = p.y - state.pointer.y;
          const d = Math.hypot(dxp, dyp);
          if (d < 130) {
            const glow = (1 - d / 130) * 0.24;
            ctx.fillStyle = `hsla(${(200 + d * 0.15) % 360}, 90%, 76%, ${glow})`;
            ctx.fillRect(p.x - 1.5, p.y - 1.5, 3, 3);
          }
        }
      }

      const corePulse = 0.14 + Math.sin(state.time * 3.5) * 0.08;
      ctx.beginPath();
      const grd = ctx.createRadialGradient(cx, cy, 2, cx, cy, Math.min(innerWidth, innerHeight) * 0.18);
      grd.addColorStop(0, `rgba(141,232,255,${0.15 + corePulse})`);
      grd.addColorStop(1, 'rgba(141,232,255,0)');
      ctx.fillStyle = grd;
      ctx.arc(cx, cy, Math.min(innerWidth, innerHeight) * 0.18, 0, Math.PI * 2);
      ctx.fill();

      if (state.pointer) {
        ctx.beginPath();
        const ring = (state.frame * 0.24) % 28 + 24;
        ctx.strokeStyle = `rgba(255,148,215,0.24)`;
        ctx.lineWidth = 1;
        ctx.arc(state.pointer.x, state.pointer.y, ring, 0, Math.PI * 2);
        ctx.stroke();
      }

      if (state.pointer && state.frame % 7 === 0) {
        seedLine.textContent = `seed: ${state.seed} · pointer: ${Math.round(state.pointer.x)}, ${Math.round(state.pointer.y)}`;
      }
      liveLine.textContent = `state: ${state.running ? 'live' : 'paused'} · nodes: ${state.particles.length} · drift ${state.drift.toFixed(2)} · chaos ${state.chaos.toFixed(2)}`;
      requestAnimationFrame(step);
    }

    function resetFromHash() {
      const params = hashParams();
      state.seed = params.seed >>> 0;
      state.density = Math.max(12, Math.min(260, params.density));
      state.drift = Math.max(0.2, Math.min(5, params.drift));
      state.chaos = Math.max(0.1, Math.min(3, params.chaos));
      state.running = !params.paused;
      syncUIFromState();
      spawn(state.seed);
      syncHash();
      updatePauseButton();
    }

    function updatePauseButton() {
      pauseBtn.textContent = state.running ? 'Pause' : 'Resume';
    }

    function updateFromInputs() {
      state.density = Number(densityEl.value);
      state.drift = Number(driftEl.value);
      state.chaos = Number(chaosEl.value);
      spawn(state.seed);
      syncHash();
    }

    function randomSeed() {
      state.seed = Math.floor(Math.random() * 2147483647);
      spawn(state.seed);
      syncHash();
      seedLine.textContent = `seed: ${state.seed}`;
      liveRegion.textContent = 'Resonant Spiral reseeded.';
    }

    function copyShareLink() {
      const url = `${location.origin}${location.pathname}${location.hash || '#'}${location.search}`;
      // Ensure URL is built from current hash state
      syncHash();
      const share = `${location.origin}${location.pathname}#${new URLSearchParams(location.hash.replace(/^#/, '')).toString()}`;
      navigator.clipboard.writeText(share).then(() => {
        liveRegion.textContent = 'Resonant Spiral share link copied.';
      }).catch(() => {
        window.prompt('Copy this Resonant Spiral link:', share);
      });
    }

    function savePNG() {
      const url = canvas.toDataURL('image/png');
      const link = document.createElement('a');
      link.download = `resonant-spiral-${state.seed}.png`;
      link.href = url;
      document.body.appendChild(link);
      link.click();
      link.remove();
      liveRegion.textContent = 'PNG exported from Resonant Spiral.';
    }

    function onPointerMove(event) {
      const rect = canvas.getBoundingClientRect();
      state.pointer = {
        x: event.clientX - rect.left,
        y: event.clientY - rect.top
      };
    }

    function onPointerLeave() {
      state.pointer = null;
    }

    function onPointerDown(event) {
      const rect = canvas.getBoundingClientRect();
      const x = event.clientX - rect.left;
      const y = event.clientY - rect.top;
      for (let i = 0; i < 10; i++) {
        const p = state.particles[(Math.random() * state.particles.length) | 0];
        if (!p) continue;
        const impulse = (i % 2 ? 1 : -1) * 2;
        p.vx += (x - p.x) * 0.0002 * impulse;
        p.vy += (y - p.y) * 0.0002 * impulse;
      }
      state.particles.forEach((p) => {
        const d = Math.hypot(p.x - x, p.y - y);
        if (d < 220) {
          p.hue = (p.hue + d * 0.12) % 360;
          p.trail = [];
        }
      });
      liveRegion.textContent = 'You stirred the field with a touch.';
    }

    densityEl.addEventListener('change', updateFromInputs);
    densityEl.addEventListener('input', () => {
      state.density = Number(densityEl.value);
      liveLine.textContent = `state: ${state.running ? 'live' : 'paused'} · nodes: ${state.density} (pending)`;
    });
    driftEl.addEventListener('change', updateFromInputs);
    chaosEl.addEventListener('change', updateFromInputs);

    pauseBtn.addEventListener('click', () => {
      state.running = !state.running;
      updatePauseButton();
      syncHash();
    });

    reseedBtn.addEventListener('click', randomSeed);
    copyBtn.addEventListener('click', copyShareLink);
    saveBtn.addEventListener('click', savePNG);

    window.addEventListener('pointermove', (event) => {
      if (!state.running) return;
      onPointerMove(event);
    });
    window.addEventListener('pointerleave', onPointerLeave);
    canvas.addEventListener('pointerdown', (event) => {
      onPointerDown(event);
      if (state.running) onPointerMove(event);
    });

    window.addEventListener('hashchange', () => {
      resetFromHash();
    });

    // Init
    resize();
    resetFromHash();
    if (!state.running) {
      updatePauseButton();
    }
    syncHash();
    const stage = document.querySelector('.stage');
    stage.setAttribute('aria-label', 'Dynamic resonant spiral field');
    canvas.setAttribute('aria-label', 'Resonant spiral animated noise field');

    if (window.ResizeObserver) {
      resizeObserver = new ResizeObserver(() => {
        resize();
        syncHash();
      });
      resizeObserver.observe(document.body);
    } else {
      window.addEventListener('resize', () => {
        resize();
      });
    }

    requestAnimationFrame(step);
  </script>
</body>
</html>
