<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Radio Echolith</title>
  <meta name="description" content="Radio Echolith is a generative pointer ritual where seeded particles trace memory echoes across a haunted static field." />
  <meta name="theme-color" content="#090b12" />
  <meta name="robots" content="index,follow" />
  <meta property="og:title" content="Radio Echolith" />
  <meta property="og:description" content="A seeded field of ghost particles drifts, collides, and remembers your pointer in one-screen static poetry." />
  <meta property="og:url" content="https://garytalbot.github.io/ghost-radio/radio-echolith.html" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Radio Echolith" />
  <meta name="twitter:description" content="A seeded pointer field for ghostly echoes and deterministic drift." />
  <style>
    :root {
      color-scheme: dark;
      --bg: #080a11;
      --ink: #ecf2ff;
      --muted: #94a3be;
      --line: rgba(255, 255, 255, 0.16);
      --a: #8de8ff;
      --b: #ff94d7;
      --c: #d1ff72;
      --panel: rgba(9, 12, 20, 0.55);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      font: 15px/1.4 "Trebuchet MS", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 18% 8%, rgba(141, 232, 255, 0.12), transparent 24%),
        radial-gradient(circle at 82% 12%, rgba(255, 148, 215, 0.12), transparent 22%),
        radial-gradient(180deg, #090b12 10%, #05070e 80%, #03040a 100%);
    }

    canvas {
      width: 100vw;
      height: 100vh;
      display: block;
      position: fixed;
      inset: 0;
    }

    .panel {
      position: fixed;
      left: 10px;
      top: 10px;
      z-index: 4;
      max-width: min(880px, calc(100vw - 20px));
      background: var(--panel);
      backdrop-filter: blur(10px);
      border: 1px solid var(--line);
      border-radius: 18px;
      padding: 11px 12px;
      box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
    }

    .panel h1 {
      margin: 0 0 6px;
      font: 700 1rem/1.2 "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #f7faff;
    }

    .panel p {
      margin: 0 0 10px;
      color: var(--muted);
      max-width: 68ch;
    }

    .row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 8px;
    }

    button, a {
      appearance: none;
      border: 1px solid rgba(255, 255, 255, 0.16);
      background: rgba(255, 255, 255, 0.04);
      color: #fff;
      border-radius: 999px;
      padding: 8px 11px;
      font: 700 0.8rem/1 "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: transform 120ms ease, box-shadow 120ms ease, border-color 120ms ease;
      user-select: none;
      white-space: nowrap;
    }

    button:hover, a:hover {
      transform: translateY(-1px);
      border-color: color-mix(in srgb, var(--a) 40%, white 60%);
      box-shadow: 0 0 0 2px rgba(141, 232, 255, 0.2);
    }

    button:focus-visible, a:focus-visible {
      outline: 2px solid #8de8ff;
      outline-offset: 2px;
    }

    .active {
      border-color: color-mix(in srgb, var(--b) 40%, white 60%);
      background: linear-gradient(135deg, rgba(141, 232, 255, 0.2), rgba(255, 148, 215, 0.14));
    }

    .mini {
      font: 700 0.74rem/1.3 "Trebuchet MS", "Segoe UI", sans-serif;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      color: #ced8f0;
      margin-top: 2px;
    }

    .stats {
      display: grid;
      gap: 4px;
      margin: 0;
      color: var(--muted);
      font-size: 0.84rem;
    }

    .stats div {
      display: flex;
      gap: 8px;
    }

    .stats b {
      color: #e8f0ff;
      min-width: 72px;
      display: inline-block;
      font-weight: 700;
    }

    label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: 0.82rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      margin: 6px 0;
    }

    input[type="range"] {
      width: 180px;
      margin: 0;
    }

    .tone {
      color: #a9beff;
      position: fixed;
      right: 12px;
      bottom: 12px;
      z-index: 4;
      font-size: 0.75rem;
      opacity: 0.77;
      background: rgba(8,10,17,.44);
      border: 1px solid rgba(255,255,255,.11);
      border-radius: 999px;
      padding: 7px 11px;
      pointer-events: none;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    @media (max-width: 760px) {
      .panel {
        max-width: calc(100vw - 16px);
      }
      .row { gap: 6px; }
      button, a { font-size: .75rem; padding: 7px 10px; }
      input[type="range"] { width: 150px; }
    }
  </style>
</head>
<body>
  <canvas id="field"></canvas>

  <section class="panel">
    <h1>Radio Echolith</h1>
    <p>Move the pointer, click the static, and watch ghost particles echo your path. Same seed, same haunt.</p>

    <div class="row">
      <button id="pauseBtn" data-state="play">Pause drift</button>
      <button id="seedBtn">Rerandomize seed</button>
      <button id="copyBtn">Copy seed link</button>
      <button id="saveBtn">Save frame</button>
      <a href="./" rel="noopener noreferrer">Return to Ghost Radio</a>
    </div>

    <div>
      <label for="chaos">
        Echo drift
        <input id="chaos" type="range" min="0.10" max="2.20" step="0.01" value="1" />
        <span id="chaosLabel">1.00</span>
      </label>
    </div>

    <div class="stats" aria-live="polite">
      <div><b>Seed</b><span id="seedLabel">--</span></div>
      <div><b>Ticks</b><span id="tickLabel">0</span></div>
      <div><b>Mode</b><span id="modeLabel">drifting</span></div>
    </div>

    <div class="mini">Tip: click to inject a flare and push memory outward.</div>
  </section>

  <div class="tone" id="toneLabel"></div>

  <script>
    const canvas = document.getElementById('field');
    const ctx = canvas.getContext('2d', { alpha: true });

    const pauseBtn = document.getElementById('pauseBtn');
    const seedBtn = document.getElementById('seedBtn');
    const copyBtn = document.getElementById('copyBtn');
    const saveBtn = document.getElementById('saveBtn');
    const chaosInput = document.getElementById('chaos');
    const chaosLabel = document.getElementById('chaosLabel');
    const seedLabel = document.getElementById('seedLabel');
    const tickLabel = document.getElementById('tickLabel');
    const modeLabel = document.getElementById('modeLabel');
    const toneLabel = document.getElementById('toneLabel');

    const palette = ['#8de8ff', '#ff94d7', '#d1ff72', '#7de6ff', '#b9a7ff'];
    const query = new URLSearchParams(location.search);

    let seed = Number(query.get('seed'));
    if (!Number.isFinite(seed) || seed <= 0) {
      seed = (Date.now() * 1000 + Math.floor(Math.random() * 1e9)) >>> 0;
    }

    const count = 520;
    let particles = [];
    let pointer = { x: 0.5, y: 0.5, down: false };
    let pointerTrail = [];
    let t = 0;
    let last = 0;
    let paused = false;
    let raf = 0;

    function xorshift(seedVal) {
      let s = seedVal >>> 0;
      return function random() {
        s ^= s << 13;
        s ^= s >>> 17;
        s ^= s << 5;
        return (s >>> 0) / 4294967296;
      };
    }

    let rand = xorshift(seed);

    function syncURL() {
      const params = new URLSearchParams(location.search);
      params.set('seed', String(seed));
      params.set('chaos', String(chaosInput.value));
      history.replaceState(null, '', `?${params.toString()}`);
      seedLabel.textContent = seed;
      chaosLabel.textContent = Number(chaosInput.value).toFixed(2);
    }

    function syncChaos() {
      chaosLabel.textContent = Number(chaosInput.value).toFixed(2);
      syncURL();
    }

    function resize() {
      const dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(innerWidth * dpr);
      canvas.height = Math.floor(innerHeight * dpr);
      canvas.style.width = innerWidth + 'px';
      canvas.style.height = innerHeight + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (!particles.length) {
        buildField();
      }
    }

    function buildField() {
      rand = xorshift(seed);
      particles = new Array(count);
      for (let i = 0; i < count; i += 1) {
        const angle = rand() * Math.PI * 2;
        const radius = Math.pow(rand(), 0.62) * Math.max(innerWidth, innerHeight);
        particles[i] = {
          x: (Math.cos(angle) * radius + innerWidth) / 2,
          y: (Math.sin(angle) * radius + innerHeight) / 2,
          vx: (rand() - 0.5) * 0.8,
          vy: (rand() - 0.5) * 0.8,
          phase: rand() * Math.PI * 2,
          hue: Math.floor(rand() * palette.length),
          ttl: 220 + Math.floor(rand() * 180)
        };
      }
    }

    function reseed() {
      seed = (seed + 0x9e3779b9 + (Math.floor(Math.random() * 100000) << 0)) >>> 0;
      buildField();
      pointerTrail = [];
      t = 0;
      syncURL();
      toneLabel.textContent = 'reseeded';
      setTimeout(() => { if (toneLabel.textContent === 'reseeded') toneLabel.textContent = ''; }, 1600);
    }

    function injectFlare(x, y) {
      for (let i = 0; i < 70; i += 1) {
        const p = {
          x,
          y,
          vx: (rand() - 0.5) * 2.6,
          vy: (rand() - 0.5) * 2.6,
          phase: rand() * Math.PI * 2,
          hue: (Math.floor(Math.random() * palette.length)),
          ttl: 90 + Math.floor(rand() * 90)
        };
        particles.push(p);
      }
      while (particles.length > 900) particles.shift();
    }

    function noise2d(x, y, amp) {
      const angle = Math.sin(x * 0.002) + Math.cos(y * 0.002) + Math.sin((x + y) * 0.001);
      return (Math.sin(angle * amp + t * 0.4) + Math.cos(angle * (amp + 1.2) - t * 0.3)) * 0.42;
    }

    function advance() {
      if (!paused) {
        t += 0.013;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const amp = Number(chaosInput.value);
        const windX = (pointer.x - 0.5) * 5;
        const windY = (pointer.y - 0.5) * 5;

        for (let i = 0; i < particles.length; i += 1) {
          const p = particles[i];
          p.phase += 0.012 * (1 + amp);
          const drift = noise2d(p.x, p.y, amp) * 0.65;
          p.vx += windX * 0.0004 + Math.cos(p.phase + drift) * 0.22;
          p.vy += windY * 0.0004 + Math.sin(p.phase + drift) * 0.22;
          p.vx *= 0.991;
          p.vy *= 0.991;
          p.x += p.vx * amp;
          p.y += p.vy * amp;

          if (p.x < 0) { p.x = innerWidth; }
          if (p.x > innerWidth) { p.x = 0; }
          if (p.y < 0) { p.y = innerHeight; }
          if (p.y > innerHeight) { p.y = 0; }

          const dmx = p.x - pointer.x * innerWidth;
          const dmy = p.y - pointer.y * innerHeight;
          const pull = 1 / (Math.sqrt(dmx * dmx + dmy * dmy) + 30);
          p.vx -= dmx * pull * 0.0025 * amp;
          p.vy -= dmy * pull * 0.0025 * amp;

          p.ttl -= 1;
          if (p.ttl <= 0) {
            const angle = rand() * Math.PI * 2;
            const radius = Math.pow(rand(), 0.58) * Math.max(innerWidth, innerHeight);
            p.x = (Math.cos(angle) * radius + innerWidth) / 2;
            p.y = (Math.sin(angle) * radius + innerHeight) / 2;
            p.vx = (rand() - 0.5) * 0.8;
            p.vy = (rand() - 0.5) * 0.8;
            p.phase = rand() * Math.PI * 2;
            p.hue = Math.floor(rand() * palette.length);
            p.ttl = 220 + Math.floor(rand() * 180);
          }

          ctx.fillStyle = palette[p.hue];
          const a = 0.28 + (Math.sin(p.phase + p.ttl * 0.02) * 0.2) + amp * 0.08;
          const r = 1.2 + amp * 0.5 + (1 - amp) * 0.4;
          ctx.globalAlpha = Math.min(1, Math.max(0.15, a));
          ctx.beginPath();
          ctx.ellipse(p.x, p.y, r, r * 1.4, Math.sin(p.phase), 0, Math.PI * 2);
          ctx.fill();

          if (i < pointerTrail.length) {
            const trail = pointerTrail[i];
            ctx.strokeStyle = 'rgba(141,232,255,0.13)';
            ctx.lineWidth = 0.9;
            ctx.beginPath();
            ctx.moveTo(p.x, p.y);
            ctx.lineTo(trail.x, trail.y);
            ctx.stroke();
          }
        }

        if (pointerTrail.length > 180) {
          pointerTrail.shift();
        }
        pointerTrail.push({ x: pointer.x * innerWidth, y: pointer.y * innerHeight, t: t });

        tickLabel.textContent = String(Math.floor(t * 1000) % 999999);
        modeLabel.textContent = paused ? 'paused' : 'drifting';
        toneLabel.textContent = `drift ${amp.toFixed(2)}x`;
      }

      raf = requestAnimationFrame(advance);
    }

    function movePointer(e) {
      const rect = canvas.getBoundingClientRect();
      pointer.x = clamp((e.clientX - rect.left) / rect.width, 0, 1);
      pointer.y = clamp((e.clientY - rect.top) / rect.height, 0, 1);
      pointer.down = (e.buttons & 1) === 1;
      if (pointer.down) {
        injectFlare(pointer.x * innerWidth, pointer.y * innerHeight);
      }
    }

    function clamp(v, lo, hi) {
      if (v < lo) return lo;
      if (v > hi) return hi;
      return v;
    }

    function copyLink() {
      const url = `${location.origin}${location.pathname}${location.search}`;
      navigator.clipboard.writeText(url).then(
        () => {
          copyBtn.textContent = 'Copied!';
          setTimeout(() => {
            copyBtn.textContent = 'Copy seed link';
          }, 1200);
        },
        () => {
          copyBtn.textContent = 'Copy failed';
          setTimeout(() => {
            copyBtn.textContent = 'Copy seed link';
          }, 1200);
        }
      );
    }

    function saveFrame() {
      const a = document.createElement('a');
      a.href = canvas.toDataURL('image/png');
      a.download = `radio-echolith-${seed}.png`;
      a.click();
    }

    function togglePause() {
      paused = !paused;
      if (paused) {
        pauseBtn.textContent = 'Resume drift';
        pauseBtn.classList.add('active');
      } else {
        pauseBtn.textContent = 'Pause drift';
        pauseBtn.classList.remove('active');
      }
      modeLabel.textContent = paused ? 'paused' : 'drifting';
    }

    pauseBtn.addEventListener('click', togglePause);
    seedBtn.addEventListener('click', reseed);
    copyBtn.addEventListener('click', copyLink);
    saveBtn.addEventListener('click', saveFrame);
    chaosInput.addEventListener('input', syncChaos);
    canvas.addEventListener('pointermove', movePointer);
    canvas.addEventListener('pointerdown', (e) => {
      movePointer(e);
      injectFlare(pointer.x * innerWidth, pointer.y * innerHeight);
    });

    window.addEventListener('resize', resize);

    const initialChaos = query.get('chaos');
    if (initialChaos) {
      const parsedChaos = Number(initialChaos);
      if (Number.isFinite(parsedChaos) && parsedChaos >= 0.1 && parsedChaos <= 2.2) {
        chaosInput.value = String(parsedChaos);
      }
    }

    syncURL();
    buildField();
    resize();
    syncChaos();
    advance();
  </script>
</body>
</html>
